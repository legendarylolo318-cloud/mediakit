# Pinned, checksummed static builds that `core`'s build script downloads
# and bundles into the binary (see build.rs). Every entry is an exact,
# immutable release asset plus a SHA-256 computed from that exact file -
# never a "latest"/rolling URL. The build fails loudly if a download's hash
# doesn't match.
#
# ffmpeg builds are GPL (BtbN win64-gpl / linux64-gpl autobuilds), which
# is why they include libx264/libx265. MediaKit's own source stays MIT -
# see THIRD_PARTY_LICENSES/ and the in-app Licenses dialog for the
# GPL compliance story (source availability etc.) for the bundled binaries
# themselves.
#
# To update: find the new release, verify its checksum yourself from the
# publisher's own checksums file (BtbN's `checksums.sha256`, yt-dlp's
# `SHA2-256SUMS`), and update the corresponding entry below. Never copy a
# hash from anywhere other than the upstream release's own checksum file.
# The weekly "vendor freshness" CI workflow (.github/workflows/vendor-check.yml)
# does exactly this automatically and opens a PR - it never auto-merges.
#
# `release_tag` and `date_pinned` are record-keeping only (build.rs doesn't
# read them): they tell a human, at a glance, how old a pin is and which
# exact upstream release it came from without having to reverse-engineer it
# from the URL.
#
# Both ffmpeg builds come from BtbN's FFmpeg-Builds project, pinned to a
# *dated* "autobuild-*" tag, not a stable release - those get pruned
# periodically, and when a pinned tag disappears every build 404s until
# vendor.toml is updated. (An earlier version of this file pointed Linux at
# johnvansickle.com's "releases" URL instead - that path is *not* pinned to
# a specific version despite looking like it; johnvansickle overwrites it in
# place on every new upstream ffmpeg release, so the checksum here would
# eventually drift out from under a build that had cached an older download.
# BtbN's per-tag release assets don't have that problem - each tag's assets
# never change after being published - which is also why Windows already
# used them.)
#
# If a pinned tag gets pruned before the next scheduled update lands, set
# MEDIAKIT_FFMPEG_URL (or MEDIAKIT_YTDLP_URL) to a mirror serving the exact
# same bytes as a stopgap - build.rs still verifies the download against the
# sha256 below, so this can only ever substitute *where* the file comes
# from, never *what* it is.

