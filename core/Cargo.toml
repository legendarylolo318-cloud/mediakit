[package]
name = "mediakit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GUI-free media conversion engine: ffprobe parsing, ffmpeg command building, job execution, target-size math"

[features]
default = ["bundled"]
# Downloads, verifies, and embeds pinned ffmpeg/ffprobe/yt-dlp binaries at
# build time (see build.rs and vendor.toml) so the app never requires the
# user to install anything. Distro packagers who must not vendor binaries
# (AUR, Nixpkgs, ...) should build with `--no-default-features` instead,
# which falls back to PATH/manual detection only.
bundled = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
ffmpeg-sidecar.workspace = true
tracing.workspace = true
zstd = "0.13.3"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
sha2 = "0.11.0"
tar = "0.4.46"
toml.workspace = true
ureq = "3.3.0"
xz2 = "0.1.7"
zip = "8.6.0"
zstd = "0.13.3"
